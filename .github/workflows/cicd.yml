name: Docker DevOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Stage 2 - Build Docker Image
        run: bash scripts/build.sh

      - name: Stage 3 - Run Container
        run: bash scripts/run.sh

      - name: Stage 4 - Health Check Monitoring
        run: bash scripts/monitor.sh

      - name: Stage 5 - Cloud Deployment Simulation
        run: bash scripts/deploy.sh
