version: '3.8'

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:80"
    container_name: devops-docker-app
    restart: always

  # Simulated Monitoring Service
  monitoring:
    image: alpine
    container_name: devops-monitor
    command: /bin/sh -c "while true; do echo '[INFO] System healthy at $(date)'; sleep 60; done"
